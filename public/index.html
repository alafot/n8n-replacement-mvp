<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workflow Builder</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        height: 100vh; display: flex; flex-direction: column; background: #f4f5f7; color: #1f2430;
      }
      header {
        padding: 10px 16px; background: #1f2430; color: #fff; display: flex; align-items: center; gap: 12px;
      }
      header .title { font-weight: 600; }
      header input { padding: 5px 8px; border-radius: 6px; border: 1px solid #3a4150; background: #2a3140; color: #fff; }
      header button {
        padding: 6px 12px; border-radius: 6px; border: 1px solid #3a4150; background: #3b4a63; color: #fff; cursor: pointer; font-size: 13px;
      }
      header button#btn-run { background: #2f9e44; border-color: #2b8a3e; }
      header .status { margin-left: auto; font-size: 12px; color: #aeb7c4; }
      .layout { flex: 1; display: flex; min-height: 0; }
      .palette { width: 220px; background: #fff; border-right: 1px solid #dfe2e8; padding: 14px; overflow-y: auto; }
      .palette h2, .inspector h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; margin: 0 0 10px; }
      .palette-category { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: #8a93a2; font-weight: 700; margin: 12px 0 6px; }
      .palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .palette-item {
        display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px;
        border: 1px solid #d4d8e0; border-radius: 8px; background: #fbfcfe; cursor: pointer;
      }
      .palette-item:hover { border-color: #4c6ef5; background: #eef2ff; }
      .palette-item .pi-icon { font-size: 18px; line-height: 1; }
      .palette-item .pi-name { font-size: 10px; color: #45506a; text-align: center; line-height: 1.15; }
      #palette-tooltip {
        position: fixed; z-index: 60; max-width: 220px; padding: 8px 10px; border-radius: 8px;
        background: #1f2430; color: #fff; font-size: 12px; box-shadow: 0 4px 14px rgba(20,30,50,0.25); pointer-events: none;
      }
      #palette-tooltip strong { display: block; margin-bottom: 2px; }
      #palette-tooltip div { color: #c3cad6; }
      #canvas-wrap { flex: 1; position: relative; overflow: auto; }
      #canvas {
        position: relative; width: 1600px; height: 1200px;
        background: radial-gradient(circle, #d7dbe2 1px, transparent 1px) 0 0 / 22px 22px;
      }
      /* Explicit size: an SVG is a replaced element, so inset:0 alone keeps its
         intrinsic 300x150 box and clips longer connection lines to a stub. */
      #links { position: absolute; top: 0; left: 0; width: 1600px; height: 1200px; overflow: visible; pointer-events: none; }
      #links line { stroke: #7c8696; stroke-width: 2; }
      .conn-del {
        position: absolute; transform: translate(-50%, -50%); width: 18px; height: 18px; line-height: 16px;
        text-align: center; border-radius: 50%; background: #fff; border: 1px solid #c1182c; color: #c1182c;
        font-size: 12px; cursor: pointer; padding: 0;
      }
      .node {
        position: absolute; width: 170px; padding: 9px 11px; border-radius: 10px; background: #fff;
        border: 1px solid #c7ccd6; box-shadow: 0 2px 6px rgba(20, 30, 50, 0.08); font-size: 13px; cursor: pointer;
      }
      .node.selected { outline: 2px solid #4c6ef5; }
      .node .node-title { font-weight: 600; }
      .node .node-type { font-size: 10px; color: #6b7280; margin-top: 2px; font-family: ui-monospace, monospace; }
      .node[data-node-type='httpRequest'] { border-top: 3px solid #4c6ef5; }
      .node[data-node-type='transform']   { border-top: 3px solid #12b886; }
      .node[data-node-type='aggregate']   { border-top: 3px solid #099268; }
      .node[data-node-type='splitOut']    { border-top: 3px solid #20c997; }
      .node[data-node-type='sort']        { border-top: 3px solid #66a80f; }
      .node[data-node-type='limit']       { border-top: 3px solid #f59f00; }
      .node[data-node-type='removeDuplicates'] { border-top: 3px solid #15aabf; }
      .node[data-node-type='renameKeys']  { border-top: 3px solid #1098ad; }
      .node[data-node-type='dateTime']    { border-top: 3px solid #d6336c; }
      .node[data-node-type='htmlExtract'] { border-top: 3px solid #0ca678; }
      .node[data-node-type='xml']         { border-top: 3px solid #099268; }
      .node[data-node-type='markdown']    { border-top: 3px solid #2b8a3e; }
      .node[data-node-type='crypto']      { border-top: 3px solid #5f3dc4; }
      .node[data-node-type='graphql']     { border-top: 3px solid #e535ab; }
      .node[data-node-type='summarize']   { border-top: 3px solid #ae3ec9; }
      .node[data-node-type='compareDatasets'] { border-top: 3px solid #7048e8; }
      .node[data-node-type='scheduleTrigger'] { border-top: 3px solid #f76707; }
      .node[data-node-type='webhookTrigger'] { border-top: 3px solid #e8590c; }
      .node[data-node-type='respondToWebhook'] { border-top: 3px solid #0c8599; }
      .node[data-node-type='formTrigger'] { border-top: 3px solid #ae3ec9; }
      .node[data-node-type='errorTrigger'] { border-top: 3px solid #e03131; }
      .in-ports { position: absolute; left: -9px; top: 16px; display: flex; flex-direction: column; gap: 2px; }
      .input-port { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; font-size: 8px; color: #fff; text-align: center; line-height: 12px; background: #495057; }
      .node[data-node-type='if']          { border-top: 3px solid #f59f00; }
      .node[data-node-type='code']        { border-top: 3px solid #ae3ec9; }
      .node[data-node-type='switch']      { border-top: 3px solid #1098ad; }
      .node[data-node-type='filter']      { border-top: 3px solid #e8590c; }
      .node[data-node-type='merge']       { border-top: 3px solid #7048e8; }
      .node[data-node-type='loop']        { border-top: 3px solid #f76707; }
      .node[data-node-type='wait']        { border-top: 3px solid #495057; }
      .node[data-node-type='noop']        { border-top: 3px solid #adb5bd; }
      .node[data-node-type='stopError']   { border-top: 3px solid #e03131; }
      .node[data-node-type='executeSubworkflow'] { border-top: 3px solid #0c8599; }
      .port[data-port='fallback'] { background: #868e96; }
      .port { background: #495057; }
      .node[data-step-status='running']   { box-shadow: 0 0 0 3px #ffd43b; }
      .node[data-step-status='completed'] { box-shadow: 0 0 0 3px #40c057; }
      .node[data-step-status='failed']    { box-shadow: 0 0 0 3px #fa5252; }
      .node[data-step-status='skipped']   { opacity: 0.5; box-shadow: 0 0 0 3px #adb5bd; }
      .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #eceff3; margin-top: 4px; }
      .ports { position: absolute; right: -9px; top: 0; display: flex; flex-direction: column; gap: 3px; }
      .port {
        width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; font-size: 8px;
        color: #fff; text-align: center; line-height: 12px;
      }
      .port[data-port='main']  { background: #495057; }
      .port[data-port='true']  { background: #2f9e44; }
      .port[data-port='false'] { background: #e8590c; }
      .port.armed { outline: 2px solid #4c6ef5; }
      .inspector { width: 300px; background: #fff; border-left: 1px solid #dfe2e8; padding: 14px; overflow-y: auto; }
      .inspector label { display: block; font-size: 12px; color: #45506280; margin: 8px 0 3px; font-weight: 600; }
      .inspector input, .inspector select, .inspector textarea {
        width: 100%; padding: 6px 8px; border: 1px solid #ccd2dc; border-radius: 6px; font-size: 13px; font-family: inherit;
      }
      .inspector textarea { font-family: ui-monospace, monospace; min-height: 60px; }
      pre#step-output { background: #f1f3f5; padding: 8px; border-radius: 6px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; }
      .hint { color: #98a1b0; font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <span class="title">Workflow Builder</span>
      <input id="automation-name" data-testid="automation-name" value="My automation" />
      <button id="btn-new" data-testid="btn-new">New</button>
      <button id="btn-save" data-testid="btn-save">Save</button>
      <button id="btn-load" data-testid="btn-load">Load…</button>
      <button id="btn-import" data-testid="btn-import">Import n8n…</button>
      <input id="import-file" data-testid="import-file" type="file" accept=".json,application/json" style="display:none" />
      <button id="btn-export" data-testid="btn-export">Export n8n</button>
      <button id="btn-history" data-testid="btn-history">History</button>
      <button id="btn-run" data-testid="btn-run">▶ Run</button>
      <span class="status" id="run-status" data-testid="run-status"></span>
      <span class="status" id="import-warning" data-testid="import-warning" style="color:#ffd43b"></span>
    </header>
    <div class="layout">
      <aside class="palette">
        <h2>Step palette</h2>
        <div id="palette"></div>
        <p class="hint" id="connect-hint" data-testid="connect-hint" style="margin-top:14px"></p>
      </aside>
      <div id="canvas-wrap">
        <div id="canvas" data-testid="canvas">
          <svg id="links"></svg>
        </div>
      </div>
      <aside class="inspector">
        <h2>Inspector</h2>
        <div id="config" data-testid="config"><p class="hint">Select a step to configure it.</p></div>
      </aside>
    </div>
    <div id="confirm-delete" data-testid="confirm-delete" style="display:none; position:fixed; inset:0; background:rgba(20,28,42,0.55); z-index:30; align-items:center; justify-content:center;">
      <div style="background:#fff; border-radius:12px; padding:20px; max-width:380px;">
        <h3 style="margin:0 0 8px; font-size:15px;">Delete step?</h3>
        <p id="confirm-delete-msg" data-testid="confirm-delete-msg" style="font-size:13px; color:#45506a; margin:0 0 16px;"></p>
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <button id="confirm-delete-no" data-testid="confirm-delete-no">Cancel</button>
          <button id="confirm-delete-yes" data-testid="confirm-delete-yes" style="background:#e03131; color:#fff; border:none; padding:6px 14px; border-radius:6px; cursor:pointer;">Delete</button>
        </div>
      </div>
    </div>
    <div id="load-panel" data-testid="load-panel" style="display:none; position:fixed; inset:0; background:rgba(20,28,42,0.55); z-index:25;">
      <div style="max-width:520px; margin:80px auto; background:#fff; border-radius:12px; padding:18px; max-height:70vh; overflow:auto;">
        <div style="display:flex; align-items:center; margin-bottom:10px;">
          <h2 style="margin:0; font-size:14px;">Open a saved automation</h2>
          <button id="btn-load-close" data-testid="btn-load-close" style="margin-left:auto;">Close</button>
        </div>
        <div id="load-rows"></div>
      </div>
    </div>
    <div id="history-panel" data-testid="history-panel" style="display:none; position:fixed; inset:0; background:rgba(20,28,42,0.55); z-index:20;">
      <div style="max-width:760px; margin:60px auto; background:#fff; border-radius:12px; padding:18px; max-height:80vh; overflow:auto;">
        <div style="display:flex; align-items:center; margin-bottom:10px;">
          <h2 style="margin:0; font-size:14px;">Run history</h2>
          <button id="btn-history-close" data-testid="btn-history-close" style="margin-left:auto;">Close</button>
        </div>
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead><tr style="text-align:left; color:#6b7280;">
            <th style="padding:6px;">Automation</th><th style="padding:6px;">When</th><th style="padding:6px;">Outcome</th>
          </tr></thead>
          <tbody id="history-rows"></tbody>
        </table>
        <div id="run-detail" data-testid="run-detail" style="margin-top:14px;"></div>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
